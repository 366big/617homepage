<script>
const LANGS=[["en","English"],["ko","한국어"],["de","Deutsch"],["es","Español"],["fr","Français"],["ar","العربية"],["id","Bahasa Indonesia"],["zh-TW","繁體中文"],["zh-CN","简体中文"],["ja","日本語"],["tr","Türkçe"]];
const T={

ko:{kingdom:"왕국",alliances:"연맹",events:"이벤트",ranking:"랭킹",migration:"이민",eyebrow:"KINGDOM 617 · ROYAL ARCHIVE",title:"이벤트",message:"이벤트 페이지는 현재 제작 중입니다.",sub:"조금만 기다려주세요."},
de:{kingdom:"Königreich",alliances:"Allianzen",events:"Events",ranking:"Rangliste",migration:"Migration",eyebrow:"KINGDOM 617 · ROYAL ARCHIVE",title:"EVENTS",message:"Der Event-Bereich befindet sich derzeit im Aufbau.",sub:"Bitte schauen Sie bald wieder vorbei."},
es:{kingdom:"Reino",alliances:"Alianzas",events:"Eventos",ranking:"Clasificación",migration:"Migración",eyebrow:"KINGDOM 617 · ROYAL ARCHIVE",title:"EVENTOS",message:"La sección de eventos está actualmente en construcción.",sub:"Vuelve pronto."},
fr:{kingdom:"Royaume",alliances:"Alliances",events:"Événements",ranking:"Classement",migration:"Migration",eyebrow:"KINGDOM 617 · ROYAL ARCHIVE",title:"ÉVÉNEMENTS",message:"La section Événements est actuellement en construction.",sub:"Revenez bientôt."},

id:{kingdom:"Kerajaan",alliances:"Aliansi",events:"Acara",ranking:"Peringkat",migration:"Migrasi",eyebrow:"KINGDOM 617 · ROYAL ARCHIVE",title:"ACARA",message:"Bagian acara sedang dalam tahap pembuatan.",sub:"Silakan kembali lagi nanti."},

};
const sel=document.getElementById("language");
LANGS.forEach(([v,n])=>{const o=document.createElement("option");o.value=v;o.textContent=n;sel.appendChild(o);});
function applyLang(lang){
  const d=T[lang]||T.en;
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.dataset.i18n;if(d[k]!=null)el.textContent=d[k];});
  if(lang==="ar") document.body.dir="rtl"; else document.body.dir="ltr";
  sel.value=lang;
  localStorage.setItem("kingdom617_lang",lang);
}
const saved=localStorage.getItem("kingdom617_lang")||"en";
sel.addEventListener("change",()=>applyLang(sel.value));
applyLang(T[saved]?saved:"en");
</script>
